version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: factory_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres        
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: postgres    
    ports:
      - "5432:5432"            
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo_db:
    image: mongo:4.4.29
    container_name: factory_mongo
    restart: always
    ports:
      - "27017:27017"         
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    container_name: factory_redis
    restart: always
    ports:
      - "6379:6379"

  backend_api:
    build: ./server
    container_name: factory_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./g-code:/g-code
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy

  telegram_bot:
    build: ./bot
    container_name: factory_bot
    restart: always
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy

  ml_predictor:
    build: ./predictor
    container_name: factory_predictor
    restart: always
    env_file:
      - .env
    command: python manage.py predict_engine
    ports:
      - "8080:8080"
    depends_on:
      mongo_db:
        condition: service_healthy
      postgres_db: 
        condition: service_healthy

  vue_frontend:
    build: ./frontend
    container_name: factory_vue
    restart: always
    env_file:
      - .env 
    ports:
      - "80:80"               

  react_frontend:
    build: ./react-dashboard
    container_name: factory_react
    restart: always
    env_file:
      - .env 
    ports:
      - "81:80"              

volumes:
  postgres_data:
  mongo_data:
